<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PlayHub</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="top">
  <div class="srow">
    <div class="sbox">
      <div class="badge">&#9654;</div>
      <input id="q" type="text" placeholder="Search apps & games" oninput="render()">
    </div>
    <button id="tbtn" class="tbtn" onclick="toggleTheme()" aria-label="Theme"></button>
  </div>
  <div class="brow">
    <span class="bname">PlayHub</span>
    <span class="pill">Official Indie Store</span>
  </div>
</header>

<main id="main"></main>

<nav class="nav">
  <button class="ni on" data-t="store" onclick="goTab('store')"><span>&#127968;</span>Store</button>
  <button class="ni" data-t="games" onclick="goTab('games')"><span>&#127918;</span>Games</button>
  <button class="ni" data-t="myapps" onclick="goTab('myapps')"><span>&#128230;</span>My Apps</button>
</nav>

<div id="modal" class="bg" onclick="closeApp()">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="stop">
      <span class="meta">App Details</span>
      <button class="xbtn" onclick="closeApp()">&times;</button>
    </div>
    <div id="mbody"></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="apps.js?v=3"></script>
<script src="engine.js?v=2"></script>
<script src="ui.js?v=2"></script>
</body>
</html>
